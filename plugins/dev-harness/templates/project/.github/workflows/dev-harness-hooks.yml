# Added by dev-harness. Proves the local guardrails still trip.
# Local hooks stop mistakes, not deliberate bypass: also require this check
# and protect your main branch in the Git host settings.
name: dev-harness-hooks

on:
  push:
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate .claude/settings.json
        run: jq empty .claude/settings.json
      - name: Hooks are registered in settings.json
        run: |
          for h in protect-paths guard-bash verify task-context task-compact; do
            jq -e --arg h "$h" '[.hooks[]?[]?.hooks[]?.command] | map(test($h + "\\.sh")) | any' .claude/settings.json >/dev/null \
              || { echo "FAIL: $h.sh is not registered in .claude/settings.json"; exit 1; }
          done
      - name: harness.conf matches its profile
        run: |
          c=.claude/hooks/harness.conf
          r=.claude/hooks/harness-conf.sh
          [ -f "$c" ] || { echo "FAIL: $c missing (hooks fall back to defaults)"; exit 1; }
          [ -f "$r" ] || { echo "FAIL: $r missing (the guard hooks block every edit and command without it)"; exit 1; }
          # The parser the hooks use, so quotes, spaces and CRLF are read exactly as they read them.
          p=$(bash "$r" PROFILE "")
          b=$(bash "$r" BLOCK_MAIN 1)
          echo "profile=$p BLOCK_MAIN=$b"
          # The hooks' rule: main protection is off only for an explicit 0.
          if [ "$p" = product ] && [ "$b" = 0 ]; then echo "FAIL: product profile with BLOCK_MAIN=0"; exit 1; fi
      - name: Run hook tests
        run: bash .claude/hooks/test-hooks.sh
