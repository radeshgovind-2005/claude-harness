# dev-harness profile config. Only the user edits this file (a hook blocks Claude).
# Parsed by the hooks, never sourced. One KEY=value per line; no inline comments.
# BLOCK_MAIN=1 blocks edits, commits and pushes on main/master.
# VERIFY_CMD runs when Claude stops; empty = off. Keep it under 60 s.
PROFILE=product
BLOCK_MAIN=1
VERIFY_CMD="npm run typecheck && npm run lint"
