name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI (for `claude plugin validate`)
        # Validation runs locally and needs no login. If install fails, the
        # validator step below fails because REQUIRE_CLAUDE=1.
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin
        env:
          REQUIRE_CLAUDE: "1"
        run: bash tests/validate.sh
      - name: Scaffold, profiles, hooks and discover lock
        run: bash tests/scaffold-test.sh
      - name: explore (experiment loop)
        run: bash tests/explore-test.sh
      - name: lens (ax-check)
        run: bash tests/lens-test.sh
      - name: goal (state and Stop hook)
        run: bash tests/goal-test.sh
