name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI (for `claude plugin validate`)
        # Validation runs locally and needs no login. If install fails, the
        # validator step below fails because REQUIRE_CLAUDE=1.
        run: npm install -g @anthropic-ai/claude-code
      - name: Tools
        run: |
          command -v jq && jq --version
          /bin/bash --version | head -n1
      - name: Validate marketplace and plugin
        env:
          REQUIRE_CLAUDE: "1"
        run: /bin/bash tests/validate.sh
      - name: Project hook self-test (the hooks that are copied into projects)
        run: /bin/bash plugins/dev-harness/templates/project/.claude/hooks/test-hooks.sh
      - name: Scaffold, profiles, hooks and discover lock
        # About 4 minutes: Ubuntu only. The other suites run on both systems.
        if: matrix.os == 'ubuntu-latest'
        run: /bin/bash tests/scaffold-test.sh
      - name: explore (experiment loop)
        run: /bin/bash tests/explore-test.sh
      - name: lens (ax-check)
        run: /bin/bash tests/lens-test.sh
      - name: goal (state and Stop hook)
        run: /bin/bash tests/goal-test.sh
      - name: showcase (facts script and role agents)
        run: /bin/bash tests/showcase-test.sh
      - name: tasks (task cards, overlap, worktrees)
        run: /bin/bash tests/tasks-test.sh
      - name: docs, examples, line endings, icon
        run: /bin/bash tests/docs-test.sh
